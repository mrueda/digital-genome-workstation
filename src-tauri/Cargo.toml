[package]
name = "dgw-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.86"
authors = ["Manuel Rueda"]
repository = "https://github.com/mrueda/digital-genome-workstation"

[lib]
name = "dgw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
dgw-core = { path = "../crates/dgw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.4"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
