<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Digital Genome Workstation workflow and architecture</title>
  <desc id="desc">A selected VCF sample is normalized into a protected source track. Editable branches use devices, evidence and background jobs, while immutable edits and run records preserve provenance. Projects and selected scenarios can be saved or exported.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#66727f"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#25313d" flood-opacity="0.12"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.k{font-size:18px;font-weight:700;letter-spacing:1.8px}.b{font-size:21px}.s{font-size:17px;fill:#596875}.box{fill:#fff;stroke:#b6c0c9;stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#66727f;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="#f4f6f8"/>
  <text x="70" y="65" class="t" font-size="34" font-weight="700">DGW workflow and persistence boundary</text>

  <rect x="70" y="130" width="250" height="190" rx="16" class="box"/>
  <text x="100" y="170" class="t k">INPUT</text>
  <text x="195" y="222" class="t h" text-anchor="middle">Sample VCF</text>
  <text x="195" y="260" class="t s" text-anchor="middle">one diploid sample</text>
  <text x="195" y="290" class="t s" text-anchor="middle">original file unchanged</text>

  <path d="M320 225H390" class="flow"/>
  <rect x="390" y="110" width="330" height="230" rx="16" class="box"/>
  <text x="420" y="150" class="t k">PRIVATE IMPORT</text>
  <text x="555" y="202" class="t h" text-anchor="middle">Filter · normalize · index</text>
  <text x="555" y="244" class="t b" text-anchor="middle">PASS records · exact ALTs</text>
  <text x="555" y="278" class="t s" text-anchor="middle">GRCh37 or GRCh38 reference</text>
  <text x="555" y="308" class="t s" text-anchor="middle">imported INFO is not used</text>

  <path d="M720 225H790" class="flow"/>
  <rect x="790" y="110" width="350" height="230" rx="16" fill="#edf8fa" stroke="#35a8bc" stroke-width="3" filter="url(#shadow)"/>
  <text x="820" y="150" class="t k">PROTECTED BASELINE</text>
  <text x="965" y="206" class="t h" text-anchor="middle">Source genome track</text>
  <g fill="#35a8bc"><path d="M875 264l13-13 13 13-13 13z"/><path d="M950 264l13-13 13 13-13 13z"/><path d="M1025 264l13-13 13 13-13 13z"/></g>
  <text x="965" y="309" class="t s" text-anchor="middle">duplicate to create alternatives</text>

  <path d="M1140 225H1210" class="flow"/>
  <rect x="1210" y="90" width="520" height="270" rx="16" fill="#fff5e9" stroke="#ed9135" stroke-width="3" filter="url(#shadow)"/>
  <text x="1240" y="132" class="t k">EDITABLE GENOME TRACKS</text>
  <text x="1470" y="184" class="t h" text-anchor="middle">Shared ancestry, separate branches</text>
  <rect x="1260" y="222" width="420" height="48" rx="9" fill="#fff" stroke="#d9a15d"/><text x="1290" y="253" class="t b">Candidate A</text>
  <rect x="1260" y="286" width="420" height="48" rx="9" fill="#fff" stroke="#d9a15d"/><text x="1290" y="317" class="t b">Candidate B</text>
  <text x="1618" y="253" class="t s" text-anchor="end">reversible edit blocks</text>
  <text x="1618" y="317" class="t s" text-anchor="end">bypass · undo · consolidate</text>

  <path d="M1470 360V430" class="flow"/>
  <rect x="780" y="430" width="950" height="255" rx="16" class="box"/>
  <text x="815" y="472" class="t k">DEVICES ON THE SELECTED TRACK</text>
  <g class="t">
    <rect x="820" y="510" width="200" height="125" rx="13" fill="#fff0e4" stroke="#ed9135" stroke-width="2"/>
    <text x="845" y="547" class="h" font-size="24">Edit</text><text x="845" y="582" class="s">Mutation Generator</text><text x="845" y="612" class="s">Genome Morph</text>
    <rect x="1040" y="510" width="230" height="125" rx="13" fill="#eaf7fa" stroke="#35a8bc" stroke-width="2"/>
    <text x="1065" y="547" class="h" font-size="24">Evidence</text><text x="1065" y="582" class="s">Consequence Predictor</text><text x="1065" y="612" class="s">ClinVar · COSMIC</text>
    <rect x="1290" y="510" width="190" height="125" rx="13" fill="#fff8df" stroke="#d6aa32" stroke-width="2"/>
    <text x="1315" y="547" class="h" font-size="24">Analyze</text><text x="1315" y="594" class="s">Genome Optimizer</text>
    <rect x="1500" y="510" width="190" height="125" rx="13" fill="#eef2fa" stroke="#7a88bf" stroke-width="2"/>
    <text x="1525" y="547" class="h" font-size="24">Visualize</text><text x="1525" y="594" class="s">Variant Map</text>
  </g>

  <path d="M1255 685V750" class="flow"/>
  <rect x="780" y="750" width="575" height="220" rx="16" class="box"/>
  <text x="815" y="792" class="t k">PROJECT AND PROVENANCE</text>
  <text x="815" y="840" class="t b">SQLite-backed .dgw project</text>
  <text x="815" y="879" class="t s">immutable edit ancestry · compact bulk layers</text>
  <text x="815" y="911" class="t s">background jobs · evidence cache · run ledger</text>
  <text x="815" y="943" class="t s">workstation session kept separate from scientific history</text>

  <path d="M1355 860H1425" class="flow"/>
  <rect x="1425" y="750" width="305" height="220" rx="16" class="box"/>
  <text x="1460" y="792" class="t k">OUTPUT</text>
  <text x="1578" y="842" class="t h" text-anchor="middle">Save or export</text>
  <text x="1578" y="886" class="t b" text-anchor="middle">.dgw project · track VCF</text>
  <text x="1578" y="923" class="t b" text-anchor="middle">regional FASTA + provenance</text>

  <rect x="70" y="430" width="640" height="540" rx="16" fill="#20242a" stroke="#7e8993" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="472" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1.8" fill="#d6dde3">LIVE EVALUATION</text>
  <text x="105" y="530" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#f5f6f7">Exact current or proposed allele</text>
  <path d="M110 578H650" stroke="#3aaabd" stroke-width="3"/>
  <text x="105" y="625" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#f5f6f7">bcftools csq + Ensembl GFF3</text>
  <text x="105" y="664" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#f5f6f7">ClinVar exact match · optional COSMIC</text>
  <text x="105" y="722" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#adb8c2">Track Monitor summarizes independent-allele</text>
  <text x="105" y="751" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#adb8c2">coverage and source-relative impact.</text>
  <text x="105" y="815" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#e5b85d">No exact database match means unknown.</text>
  <text x="105" y="863" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#d88978">Scores are not disease, fitness, or clinical predictions.</text>
  <path d="M780 574H710" class="flow"/>
</svg>
