<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71858f"/></marker></defs><rect width="1500" height="1140" fill="white"/><text x="40" y="48" font-family="DejaVu Sans" font-size="36" font-weight="bold" fill="#24343c">From an imported sample to an edited track</text><text x="40" y="87" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#24343c">DGW v0.1 · the source is retained; edits and analyses remain separate</text><rect x="40" y="125" width="420" height="155" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="60" y="161" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Import one VCF sample</text><text x="60" y="199" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">PASS filtering; normalization</text><text x="60" y="230" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Assembly-matched reference</text><rect x="540" y="125" width="420" height="155" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="560" y="161" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Source track</text><text x="560" y="199" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Read-only imported genotype</text><text x="560" y="230" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Duplicate to begin editing</text><rect x="1040" y="125" width="420" height="155" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="1060" y="161" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Editable track</text><text x="1060" y="199" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Alternative configuration</text><text x="1060" y="230" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Both chromosome copies</text><path d="M465 205L530 205" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M965 205L1030 205" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M1250 285L1250 325" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><rect x="1040" y="335" width="420" height="175" rx="12" fill="#edf6f4" stroke="#adbdc5" stroke-width="2"/><text x="1060" y="371" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Make reversible edits</text><text x="1060" y="409" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Allele Roll: manual edits</text><text x="1060" y="440" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Generator, Optimizer, Morph</text><text x="1060" y="471" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Undo/Redo; edit-block controls</text><text x="40" y="366" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#24343c">Selection determines the analysis scope</text><text x="40" y="407" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">One allele, an interval, a gene or all selected loci. Zoom is not selection.</text><text x="40" y="447" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Genome Morph instead uses differences between two tracks.</text><text x="40" y="487" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Independent allele predictions do not model combined variant effects.</text><path d="M1250 515L1250 555" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M200 560H1290" stroke="#71858f" stroke-width="3"/><path d="M200 560L200 596" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M565 560L565 596" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M930 560L930 596" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><path d="M1290 560L1290 596" stroke="#71858f" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="606" width="345" height="220" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="50" y="642" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Evidence panel</text><text x="50" y="680" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Inspect one exact allele</text><text x="50" y="711" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Computed predictions</text><text x="50" y="742" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Database matches</text><text x="50" y="773" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Resource provenance</text><rect x="395" y="606" width="345" height="220" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="415" y="642" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#24343c">Consequence Predictor</text><text x="415" y="680" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Current selected alleles</text><text x="415" y="711" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Including unchanged loci</text><text x="415" y="742" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Transcript-effect table</text><text x="415" y="773" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Filters and pagination</text><rect x="760" y="606" width="345" height="220" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="780" y="642" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Track Monitor</text><text x="780" y="680" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Active mutation summary</text><text x="780" y="711" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Impact change vs source</text><text x="780" y="742" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Coverage and counts</text><text x="780" y="773" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Background profiling</text><rect x="1125" y="606" width="345" height="220" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="1145" y="642" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Track Compare</text><text x="1145" y="680" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Source vs current</text><text x="1145" y="711" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Selected loci</text><text x="1145" y="742" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">DNA / genome view</text><text x="1145" y="773" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Consequence changes</text><text x="40" y="882" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#24343c">Saving or exporting does not require a completed analysis.</text><rect x="40" y="922" width="685" height="156" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="60" y="958" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Save project (.dgw)</text><text x="60" y="996" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Retain tracks, history, jobs and cached results</text><text x="60" y="1027" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Resource databases remain external</text><rect x="775" y="922" width="685" height="156" rx="12" fill="#eef4f6" stroke="#adbdc5" stroke-width="2"/><text x="795" y="958" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#24343c">Export a track or region</text><text x="795" y="996" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">VCF with edit provenance</text><text x="795" y="1027" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#24343c">Regional FASTA with a sidecar record</text><text x="40" y="1110" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#24343c">Arrows show the user workflow, not a mandatory processing pipeline.</text></svg>