<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
  <title id="title">DGW genome track and device flow</title>
  <desc id="desc">A normalized VCF becomes a read-only source genome track, which is duplicated into an experimental track with a device rack and visible edit blocks before evaluation, consolidation, or export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17191c"/><stop offset="1" stop-color="#202329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#727780"/></marker>
  </defs>
  <rect width="1100" height="240" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#727780" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 120h55"/><path d="M385 120h50"/><path d="M610 120h52"/><path d="M850 120h48"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g><rect x="25" y="78" width="155" height="84" rx="10" fill="#25282e" stroke="#4b505a"/><text x="102" y="108" fill="#b8bdc7" font-size="12" letter-spacing="2">INPUT</text><text x="102" y="136" fill="#f2f3f5" font-size="17">Normalized VCF</text></g>
    <g><rect x="235" y="61" width="150" height="118" rx="12" fill="#25282e" stroke="#63a7d8" stroke-width="2"/><text x="310" y="92" fill="#86bee6" font-size="12" letter-spacing="2">READ-ONLY</text><text x="310" y="120" fill="#f2f3f5" font-size="16">Source track</text><text x="310" y="148" fill="#9ca1aa" font-size="11">Copy 1 + Copy 2</text></g>
    <g><rect x="435" y="42" width="175" height="156" rx="12" fill="#292b31" stroke="#e0a64c" stroke-width="2"/><text x="522" y="72" fill="#f0bc69" font-size="12" letter-spacing="2">EXPERIMENTAL TRACK</text><text x="522" y="101" fill="#f2f3f5" font-size="15">Device rack</text><rect x="460" y="119" width="48" height="24" rx="5" fill="#3c3230" stroke="#dd7d63"/><text x="484" y="136" fill="#f3b09d" font-size="10">A→T</text><rect x="518" y="119" width="66" height="24" rx="5" fill="#333840" stroke="#808794"/><text x="551" y="136" fill="#d8dbe0" font-size="10">DEL</text><text x="522" y="172" fill="#9ca1aa" font-size="11">visible edit blocks</text></g>
    <g><rect x="662" y="56" width="188" height="128" rx="12" fill="#25282e" stroke="#4b505a"/><text x="756" y="86" fill="#b8bdc7" font-size="12" letter-spacing="2">SELECTED ALLELE</text><text x="756" y="113" fill="#f2f3f5" font-size="13">Consequences · dbNSFP</text><text x="756" y="137" fill="#f2f3f5" font-size="13">ClinVar · COSMIC</text><text x="756" y="164" fill="#9ca1aa" font-size="11">one edit at a time</text></g>
    <g><rect x="898" y="61" width="177" height="118" rx="12" fill="#292b31" stroke="#a98bd4"/><text x="986" y="92" fill="#c5a9eb" font-size="12" letter-spacing="2">EXPLICIT ACTION</text><text x="986" y="120" fill="#f2f3f5" font-size="15">Consolidate</text><text x="986" y="146" fill="#f2f3f5" font-size="15">or export</text></g>
  </g>
</svg>
