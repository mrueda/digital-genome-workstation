<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">From a source VCF to a saved genome scenario</title>
  <desc id="desc">Import one sample into a read-only source track. Use the Working track or a duplicate and edit the candidate. Evaluate individual alleles and compare track summaries, then save the project or export. The input VCF is unchanged.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#637988"/></marker></defs>
  <rect width="960" height="370" rx="16" fill="#f6f8fa"/>
  <g fill="none" stroke="#637988" stroke-width="2" marker-end="url(#arrow)"><path d="M292 98H330"/><path d="M620 98H658"/><path d="M806 158V205H166V237"/><path d="M292 294H330"/><path d="M620 294H658"/></g>
  <g font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">
    <g fill="#ffffff" stroke="#247f92"><rect x="22" y="38" width="270" height="120" rx="10"/><rect x="338" y="38" width="282" height="120" rx="10"/></g>
    <rect x="666" y="38" width="272" height="120" rx="10" fill="#ffffff" stroke="#a66a13"/>
    <g fill="#ffffff" stroke="#776099"><rect x="22" y="242" width="270" height="104" rx="10"/><rect x="338" y="242" width="282" height="104" rx="10"/><rect x="666" y="242" width="272" height="104" rx="10"/></g>
    <g fill="#24333d"><text x="157" y="78">1 · Import one sample</text><text x="479" y="78">2 · Choose a track</text><text x="802" y="78">3 · Edit candidate</text><text x="157" y="277">4 · Evaluate alleles</text><text x="479" y="277">5 · Compare tracks</text><text x="802" y="277">6 · Save or export</text></g>
    <g fill="#4b5d69" font-size="17"><text x="157" y="113">VCF → read-only track</text><text x="157" y="139">Input file unchanged</text><text x="479" y="113">Working track or duplicate</text><text x="479" y="139">Same source coordinates</text><text x="802" y="113">Manual or device-generated</text><text x="802" y="139">Reversible changes</text><text x="157" y="313">Predictions + exact records</text><text x="479" y="313">Independent-allele summaries</text><text x="802" y="313">Project · VCF · regional FASTA</text></g>
  </g>
</svg>
