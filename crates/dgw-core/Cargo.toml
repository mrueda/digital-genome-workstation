[package]
name = "dgw-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.86"
authors = ["Manuel Rueda"]
repository = "https://github.com/mrueda/digital-genome-workstation"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
