name: Build macOS test installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac processor
        required: true
        default: apple-silicon
        type: choice
        options:
          - apple-silicon
          - intel

permissions:
  contents: read

jobs:
  dmg:
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cargo test -p dgw-desktop --lib
      - run: npm run tauri build -- --bundles dmg
      - name: Inspect app bundle and name the test download
        shell: bash
        run: |
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          image="target/release/bundle/dmg/dgw-macos-${{ inputs.architecture }}.dmg"
          mv "${images[0]}" "$image"
          hdiutil verify "$image"
          # Tauri removes the intermediate .app after creating the DMG.
          # Inspect the actual downloadable image instead.
          mount_dir="$(mktemp -d)"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          plist="$mount_dir/DGW.app/Contents/Info.plist"
          plutil -lint "$plist"
          # Validate the complete app, not just the disk-image checksum.
          # Ad-hoc signing provides integrity, not Developer ID trust/notarization.
          codesign --display --verbose=4 "$mount_dir/DGW.app"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/DGW.app"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$plist")"
          test -f "$mount_dir/DGW.app/Contents/MacOS/$executable"
          file "$mount_dir/DGW.app/Contents/MacOS/$executable"
          test "$(lipo -archs "$mount_dir/DGW.app/Contents/MacOS/$executable")" = "${{ inputs.architecture == 'intel' && 'x86_64' || 'arm64' }}"
          cd target/release/bundle/dmg
          shasum -a 256 "dgw-macos-${{ inputs.architecture }}.dmg" > "dgw-macos-${{ inputs.architecture }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dgw-macos-${{ inputs.architecture }}-test
          path: |
            target/release/bundle/dmg/dgw-macos-*.dmg
            target/release/bundle/dmg/*.sha256
          if-no-files-found: error
          retention-days: 7
