name: Build macOS test installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac processor
        required: true
        default: apple-silicon
        type: choice
        options:
          - apple-silicon
          - intel

permissions:
  contents: read

jobs:
  dmg:
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cargo test -p dgw-desktop --lib
      - run: npm run tauri build -- --bundles dmg
      - name: Inspect app bundle and name the test download
        shell: bash
        run: |
          test -d target/release/bundle/macos/DGW.app
          test -f target/release/bundle/macos/DGW.app/Contents/MacOS/dgw-desktop
          file target/release/bundle/macos/DGW.app/Contents/MacOS/dgw-desktop
          plutil -lint target/release/bundle/macos/DGW.app/Contents/Info.plist
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          image="target/release/bundle/dmg/dgw-macos-${{ inputs.architecture }}.dmg"
          mv "${images[0]}" "$image"
          hdiutil verify "$image"
          cd target/release/bundle/dmg
          shasum -a 256 "dgw-macos-${{ inputs.architecture }}.dmg" > "dgw-macos-${{ inputs.architecture }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dgw-macos-${{ inputs.architecture }}-test
          path: |
            target/release/bundle/dmg/dgw-macos-*.dmg
            target/release/bundle/dmg/*.sha256
          if-no-files-found: error
          retention-days: 7
